name: Checks

"on":
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
      - name: Install system bindings
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi gir1.2-glib-2.0
      - name: Install test dependencies
        run: |
          uv venv --python /usr/bin/python3 --system-site-packages .venv
          uv pip sync --python .venv/bin/python requirements-dev.txt
      - name: Run the gate
        run: ./verify.sh
      - name: Run the scheduled parser campaign
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: ./fuzz.sh 120
      - name: Preserve failed fuzz inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure
          path: .verify.campaign.*/
          include-hidden-files: true
          if-no-files-found: ignore
